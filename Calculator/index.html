<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main>
      <nav>
        <h1>calc</h1>
        <div class="theme-container">
          <p>THEME</p>
        </div>
      </nav>

      <div class="calcu-container">
        <p class="previous-operand"></p>
        <p class="current-operand"></p>
      </div>

      <div class="operands-container">
        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button data-delete="delete" class="delete">DEL</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button data-operator="addition">+</button>

        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button data-operator="subtract">-</button>

        <button data-float=".">.</button>
        <button data-number="0">0</button>
        <button data-operator="divide">÷</button>
        <button data-operator="multiply">x</button>

        <button data-reset="reset" class="reset">RESET</button>
        <button data-equals="equal" class="equals">=</button>
      </div>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
