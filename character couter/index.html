<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time character checker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h2>Real time Character Checker</h2>
      <textarea
        id="textarea"
        class="textarea"
        maxlength="250"
        placeholder="Please write your text here..."
      ></textarea>

      <div class="counter-container">
        <p>Total Character: <span class="character-counter">0</span></p>
        <p>Remaining: <span class="remaining"></span></p>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
